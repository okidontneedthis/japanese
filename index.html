<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eceff5;
  --panel:#f8f9fc;
  --ink:#1b2236;
  --muted:#5a6580;
  --line:#d2d8e6;
  --hover:#e8ecf6;
  --accent:#2b4a96;
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10131d;
    --panel:#192031;
    --ink:#e5e9f4;
    --muted:#98a3bd;
    --line:#2c3550;
    --hover:#222b43;
    --accent:#93acee;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131d;
  --panel:#192031;
  --ink:#e5e9f4;
  --muted:#98a3bd;
  --line:#2c3550;
  --hover:#222b43;
  --accent:#93acee;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  padding-block:2.5rem 4rem;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.page{max-width:60rem;margin:0 auto}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.15;margin:0 0 .35rem}
h2{font-family:var(--serif);font-weight:700;margin:0}
.sub{color:var(--muted);margin:0 0 1.6rem;font-size:.95rem}
.search input{
  width:100%;max-width:26rem;font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:.5rem .65rem;margin-bottom:1.5rem;
}
input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shelf{columns:2 21rem;column-gap:1.5rem}
.cat{break-inside:avoid;margin:0 0 1.5rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem .5rem}
.cat-head{display:flex;align-items:baseline;gap:.6rem;padding-bottom:.55rem;border-bottom:2px solid var(--accent)}
.cat-head h2{font-size:1.2rem}
.count{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.links{list-style:none;margin:0;padding:0}
.links li{border-bottom:1px solid var(--line)}
.links li:last-child{border-bottom:0}
.links a{display:block;padding:.7rem .4rem;color:inherit;text-decoration:none;border-radius:6px}
.links a:hover{background:var(--hover)}
.t{display:block;font-weight:700;color:var(--accent);overflow-wrap:anywhere}
.links a:hover .t{text-decoration:underline}
.n{display:block;font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.empty{color:var(--muted);max-width:34rem;padding:1rem 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="page">
  <h1>Nihongo Shelf</h1>
  <p class="sub" id="summary"></p>
  <div class="search">
    <label class="sr" for="q">Search sheets</label>
    <input id="q" type="search" placeholder="Search sheets" autocomplete="off">
  </div>
  <div class="shelf" id="shelf"></div>
</main>

<script src="links.js"></script>
<script>
(function () {
  var shelf = document.getElementById('shelf');
  var summary = document.getElementById('summary');
  var qInput = document.getElementById('q');
  var data = window.SHELF;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  if (!data || !Array.isArray(data.links)) {
    summary.textContent = 'Could not load links.js. Keep it in the same folder as index.html.';
    return;
  }

  // Only relative paths and http(s) links are allowed as targets.
  function target(l) {
    var s = String(l.file || l.url || '').trim();
    if (!s) return null;
    if (/^[a-z][a-z0-9+.-]*:/i.test(s) && !/^https?:/i.test(s)) return null;
    return s;
  }

  // Categories: listed ones first (in order), then any others in order of first use.
  var order = (data.categories || []).slice();
  data.links.forEach(function (l) {
    if (l.category && order.indexOf(l.category) === -1) order.push(l.category);
  });

  function render() {
    var q = qInput.value.trim().toLowerCase();
    shelf.textContent = '';
    var shownLinks = 0;
    order.forEach(function (name) {
      var items = data.links.filter(function (l) {
        if (l.category !== name) return false;
        if (!q) return true;
        return (String(l.title) + ' ' + String(l.note || '')).toLowerCase().indexOf(q) !== -1;
      });
      if (!items.length) return;
      var section = el('section', 'cat');
      var head = el('div', 'cat-head');
      head.appendChild(el('h2', null, name));
      head.appendChild(el('span', 'count', String(items.length)));
      var ul = el('ul', 'links');
      items.forEach(function (l) {
        var href = target(l);
        var li = el('li');
        var a = el('a');
        if (href) {
          a.href = href;
          if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        }
        a.appendChild(el('span', 't', l.title));
        if (l.note) a.appendChild(el('span', 'n', l.note));
        li.appendChild(a);
        ul.appendChild(li);
        shownLinks++;
      });
      section.appendChild(head);
      section.appendChild(ul);
      shelf.appendChild(section);
    });
    if (!shownLinks) {
      shelf.style.columns = 'auto';
      shelf.appendChild(el('p', 'empty', q ? 'No sheets match "' + qInput.value.trim() + '".' : 'Nothing on the shelf yet. Add a line to links.js.'));
    } else {
      shelf.style.columns = '';
    }
  }

  var n = data.links.length;
  summary.textContent = n + (n === 1 ? ' sheet' : ' sheets') + ' in ' + order.length + (order.length === 1 ? ' category' : ' categories');
  qInput.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
